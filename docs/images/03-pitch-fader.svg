<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
  <style>
    .blk  { fill:#fff; stroke:#222; stroke-width:1.5; }
    .oem  { fill:#f1f8e9; stroke:#33691e; stroke-width:1.8; }
    .esp  { fill:#e8f5ff; stroke:#0d47a1; stroke-width:2; }
    .danger{ fill:#ffebee; stroke:#b71c1c; stroke-width:2; }
    .title{ font-size:18px; font-weight:700; fill:#111; }
    .h    { font-size:14px; font-weight:700; fill:#111; }
    .note { font-size:11px; fill:#555; }
    .pin  { font-size:11px; font-weight:600; fill:#0d47a1; }
    .red  { fill:#c62828; }
    .pwr5 { stroke:#c62828; stroke-width:2.5; fill:none; }
    .pwr3 { stroke:#1565c0; stroke-width:2.5; fill:none; }
    .gnd  { stroke:#444; stroke-width:1.5; stroke-dasharray:4,3; fill:none; }
    .sig  { stroke:#ef6c00; stroke-width:2; fill:none; }
    .cut  { stroke:#b71c1c; stroke-width:3; fill:none; }
    .pot-body { fill:#fafafa; stroke:#444; stroke-width:1.5; }
    .pot-wiper{ stroke:#000; stroke-width:2; fill:none; marker-end:url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#000"/>
    </marker>
    <marker id="x" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="10" markerHeight="10" orient="auto">
      <line x1="2" y1="2" x2="12" y2="12" stroke="#b71c1c" stroke-width="3"/>
      <line x1="12" y1="2" x2="2" y2="12" stroke="#b71c1c" stroke-width="3"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">03 — Pitch Fader Wiring</text>
  <text x="20" y="46" class="note">100 mm linear pot → S3 ADC. CUT OEM 5 V on the slider top, re-feed 3.3 V. ADC range is 0–3.3 V only.</text>

  <!-- DANGER BANNER -->
  <rect x="20" y="70" width="1160" height="40" rx="6" class="danger"/>
  <text x="600" y="96" text-anchor="middle" class="h" fill="#b71c1c">⚠  CUT the OEM 5 V trace to the fader top BEFORE applying power. 5 V on the wiper damages the S3 ADC.</text>

  <!-- OEM Fader assembly -->
  <rect x="40" y="140" width="320" height="440" rx="10" class="oem"/>
  <text x="200" y="166" text-anchor="middle" class="h" fill="#33691e">OEM PITCH FADER (KEEP)</text>
  <text x="200" y="182" text-anchor="middle" class="note">100 mm linear taper pot</text>
  <text x="200" y="198" text-anchor="middle" class="note">amber flex PCB; OE part TBD</text>
  <text x="200" y="214" text-anchor="middle" class="note">(aftermarket replacements stamped "9079")</text>

  <!-- Pot body -->
  <rect x="170" y="240" width="60" height="280" rx="6" class="pot-body"/>
  <text x="200" y="260" text-anchor="middle" class="note">100 mm</text>

  <!-- Pot track -->
  <line x1="200" y1="252" x2="200" y2="510" stroke="#aaa" stroke-width="2"/>

  <!-- Wiper at midpoint -->
  <line x1="240" y1="380" x2="218" y2="380" class="pot-wiper"/>

  <!-- Pot terminals -->
  <circle cx="200" cy="248" r="4" fill="#c62828"/>
  <text x="184" y="252" text-anchor="end" class="note" fill="#c62828">VCC (top, +100 %)</text>
  <circle cx="240" cy="380" r="4" fill="#ef6c00"/>
  <text x="260" y="384" class="note" fill="#ef6c00">wiper (middle)</text>
  <circle cx="200" cy="514" r="4" fill="#444"/>
  <text x="184" y="518" text-anchor="end" class="note">GND (bottom)</text>

  <!-- Pot exits to right via amber flex -->
  <line x1="200" y1="248" x2="340" y2="248" class="pwr5"/>
  <line x1="240" y1="380" x2="340" y2="380" class="sig"/>
  <line x1="200" y1="514" x2="340" y2="514" class="gnd"/>

  <!-- Cut symbol on the 5V trace going to fader top -->
  <line x1="320" y1="238" x2="340" y2="258" class="cut"/>
  <line x1="320" y1="258" x2="340" y2="238" class="cut"/>
  <rect x="294" y="216" width="54" height="34" rx="4" fill="#fff" stroke="#b71c1c"/>
  <text x="321" y="237" text-anchor="middle" class="note" fill="#b71c1c" font-weight="700">CUT</text>

  <text x="200" y="560" text-anchor="middle" class="note">range modes: ±8 % / ±16 % / ±100 %</text>
  <text x="200" y="576" text-anchor="middle" class="note">software selects via TEMPO RANGE button</text>

  <!-- ============================================================ -->
  <!-- ESP32-S3 -->
  <!-- ============================================================ -->
  <rect x="780" y="160" width="400" height="380" rx="12" class="esp"/>
  <text x="980" y="188" text-anchor="middle" class="h" fill="#0d47a1">ESP32-S3 DevKitC-1</text>
  <text x="980" y="204" text-anchor="middle" class="note">3 V3 LDO out · ADC1_CH0 on GPIO 1</text>

  <g font-size="11" font-weight="600">
    <circle cx="800" cy="240" r="4" fill="#1565c0"/>
    <text x="812" y="244" class="pin" fill="#1565c0">3.3 V  (LDO out)</text>

    <circle cx="800" cy="290" r="4" fill="#ef6c00"/>
    <text x="812" y="294" class="pin" fill="#ef6c00">GPIO 1  = ADC1_CH0  (wiper in)</text>

    <circle cx="800" cy="340" r="4" fill="#444"/>
    <text x="812" y="344" class="pin">GND</text>
  </g>

  <!-- ADC config -->
  <rect x="800" y="380" width="360" height="140" rx="8" fill="#fff" stroke="#1565c0"/>
  <text x="980" y="402" text-anchor="middle" class="h" fill="#0d47a1">ADC config</text>
  <text x="815" y="422" class="note">attenuation: ADC_ATTEN_DB_12  (full 0–3.3 V range)</text>
  <text x="815" y="438" class="note">bitwidth:    ADC_BITWIDTH_12  (0..4095 raw)</text>
  <text x="815" y="454" class="note">mode:        oneshot @ 1 kHz polling</text>
  <text x="815" y="470" class="note">calibration: ADC_CAL_CURVE_FITTING (eFuse-trimmed)</text>
  <text x="815" y="486" class="note">filtering:   8-tap moving avg + 14-bit MIDI scale</text>
  <text x="815" y="504" class="note">dead-zone:   ±0.5 % around midpoint (12.5 / 2048)</text>

  <!-- Wires from fader to S3 -->
  <!-- 3.3V to fader top -->
  <path d="M800 240 H 600 V 248 H 340" class="pwr3"/>
  <text x="500" y="232" class="note" fill="#1565c0">3.3 V re-feed → fader top (replaces OEM 5 V)</text>

  <!-- Wiper to GPIO 1 -->
  <path d="M340 380 H 600 V 290 H 800" class="sig"/>
  <text x="500" y="280" class="note" fill="#ef6c00">wiper → ADC1_CH0 (GPIO 1)</text>

  <!-- GND -->
  <path d="M340 514 H 580 V 340 H 800" class="gnd"/>

  <!-- ============================================================ -->
  <!-- Voltage range comparison -->
  <!-- ============================================================ -->
  <rect x="400" y="140" width="360" height="200" rx="10" class="blk"/>
  <text x="580" y="164" text-anchor="middle" class="h">Why the 3.3 V re-feed matters</text>

  <text x="420" y="190" class="note" fill="#c62828" font-weight="700">If you leave OEM 5 V on the fader top:</text>
  <text x="420" y="206" class="note">  wiper sweeps 0 V (bottom) → 5 V (top)</text>
  <text x="420" y="222" class="note">  S3 ADC absolute max = 3.3 V → top 34 %</text>
  <text x="420" y="238" class="note">  of fader range clips and stresses the pin</text>

  <text x="420" y="262" class="note" fill="#1565c0" font-weight="700">After cutting + re-feeding 3.3 V:</text>
  <text x="420" y="278" class="note">  wiper sweeps 0 V → 3.3 V cleanly</text>
  <text x="420" y="294" class="note">  full ADC range = full fader travel</text>
  <text x="420" y="310" class="note">  12-bit ADC = 4096 steps over 100 mm</text>
  <text x="420" y="326" class="note">  = ~25 µm of fader travel per ADC count</text>

  <!-- ============================================================ -->
  <!-- Calibration block -->
  <!-- ============================================================ -->
  <rect x="400" y="360" width="360" height="220" rx="10" class="blk"/>
  <text x="580" y="384" text-anchor="middle" class="h">Calibration procedure (first boot)</text>

  <text x="420" y="408" class="note" font-weight="700">1.</text>
  <text x="445" y="408" class="note">Slide fader to top, sample 100×, record max_raw.</text>

  <text x="420" y="426" class="note" font-weight="700">2.</text>
  <text x="445" y="426" class="note">Slide fader to bottom, sample 100×, record min_raw.</text>

  <text x="420" y="444" class="note" font-weight="700">3.</text>
  <text x="445" y="444" class="note">Centre the fader, hold 2 s, record centre_raw.</text>

  <text x="420" y="462" class="note" font-weight="700">4.</text>
  <text x="445" y="462" class="note">Persist (min, centre, max) to NVS.</text>

  <text x="420" y="480" class="note" font-weight="700">5.</text>
  <text x="445" y="480" class="note">Runtime: scale (raw − centre) into ±8 192</text>

  <text x="445" y="496" class="note">14-bit signed pitch value, clipped to (min, max).</text>

  <text x="420" y="520" class="note" font-weight="700">6.</text>
  <text x="445" y="520" class="note">Apply ±0.5 % dead-zone around centre so the</text>
  <text x="445" y="536" class="note">pot never reports "drift" at rest.</text>

  <text x="420" y="558" class="note">Recalibrate when EJECT + CUE + TIME held for 3 s.</text>
</svg>
