<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
  <style>
    .chassis { fill:#f5f5f5; stroke:#222; stroke-width:3; }
    .keep    { fill:#dcedc8; stroke:#33691e; stroke-width:2; }
    .keep-led{ fill:#fff9c4; stroke:#f57f17; stroke-width:2; }
    .remove  { fill:#ffcdd2; stroke:#b71c1c; stroke-width:2; stroke-dasharray:8,4; }
    .esp     { fill:#bbdefb; stroke:#0d47a1; stroke-width:2.5; }
    .glass   { fill:#fff; stroke:#666; stroke-width:1.5; }
    .lbl     { fill:#1a1a1a; }
    .hdr     { font-size:20px; font-weight:700; fill:#0d47a1; }
    .h       { font-size:14px; font-weight:700; fill:#111; }
    .note    { font-size:11px; fill:#555; }
    .dwg     { font-size:11px; font-weight:600; fill:#33691e; }
    .arrow   { stroke:#0d47a1; stroke-width:2; fill:none; marker-end:url(#arr); }
    .legend-sw{ fill:#fff; stroke:#222; stroke-width:1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d47a1"/>
    </marker>
  </defs>

  <text x="20" y="32" class="hdr">CDJ-1000MK2 — Top-Down Physical Layout</text>
  <text x="20" y="52" class="note">What stays (green), what's stripped (red), where the ESP32-S3 mounts (blue). Real chassis ~320 × 416 mm.</text>

  <!-- Chassis outline -->
  <rect x="60" y="80" width="900" height="780" rx="14" class="chassis"/>

  <!-- BACK label -->
  <text x="510" y="100" text-anchor="middle" class="h">⟵ BACK PANEL (AC inlet, RCA out, control IN/OUT) ⟶</text>

  <!-- Jog wheel area -->
  <circle cx="380" cy="450" r="200" class="keep"/>
  <text x="380" y="245" text-anchor="middle" class="h" fill="#33691e">JOG WHEEL ASSEMBLY (KEEP)</text>
  <text x="380" y="262" text-anchor="middle" class="dwg">JOGB Assy = DWG1569</text>
  <text x="380" y="278" text-anchor="middle" class="note">JOG A = DNK4172 · JOG B = DNK4173 · JOG C = DNK4174</text>
  <text x="380" y="294" text-anchor="middle" class="note">JOG Plate = DAH2052 · JOG Panel = DAH2182</text>

  <!-- Jog hub PCB (centre of jog wheel) -->
  <circle cx="380" cy="450" r="62" class="keep"/>
  <text x="380" y="430" text-anchor="middle" class="h" fill="#33691e">JOG HUB PCB</text>
  <text x="380" y="446" text-anchor="middle" class="note">optical encoder</text>
  <text x="380" y="460" text-anchor="middle" class="note">+ touch sense</text>
  <text x="380" y="474" text-anchor="middle" class="note">+ vinyl LED</text>

  <!-- Vinyl indicator -->
  <circle cx="380" cy="500" r="8" fill="#42a5f5" stroke="#01579b" stroke-width="1"/>
  <text x="395" y="504" class="note">vinyl LED (blue)</text>

  <!-- Pitch fader -->
  <rect x="800" y="240" width="48" height="380" rx="8" class="keep"/>
  <text x="824" y="218" text-anchor="middle" class="h" fill="#33691e">PITCH FADER</text>
  <text x="824" y="232" text-anchor="middle" class="dwg">100 mm linear pot</text>
  <line x1="800" y1="430" x2="848" y2="430" stroke="#000" stroke-width="2"/>
  <text x="864" y="434" class="note">wiper at midpoint</text>
  <text x="824" y="640" text-anchor="middle" class="note">3 wires: VCC / wiper / GND</text>

  <!-- Top button row (above jog) -->
  <rect x="100" y="120" width="620" height="80" rx="8" class="keep"/>
  <text x="410" y="148" text-anchor="middle" class="h" fill="#33691e">TOP BUTTON PCB</text>
  <text x="410" y="166" text-anchor="middle" class="note">TRACK SEARCH ◁▷ · SEARCH ◁▷ · TEMPO RANGE · MASTER TEMPO</text>
  <text x="410" y="182" text-anchor="middle" class="note">TIME MODE / AUTO CUE · TEXT MODE · JOG MODE · DIRECTION</text>

  <!-- Hot cue / loop cluster (MK2 specific) -->
  <rect x="100" y="220" width="220" height="100" rx="8" class="keep"/>
  <text x="210" y="244" text-anchor="middle" class="h" fill="#33691e">HOT CUE PCB</text>
  <text x="210" y="262" text-anchor="middle" class="note">HOT CUE A · B · C</text>
  <text x="210" y="278" text-anchor="middle" class="note">REC MODE</text>
  <text x="210" y="296" text-anchor="middle" class="note">⚠ MK2 addition</text>
  <text x="210" y="312" text-anchor="middle" class="dwg">verify CN on RRV2802</text>

  <!-- Loop cluster -->
  <rect x="100" y="340" width="220" height="100" rx="8" class="keep"/>
  <text x="210" y="364" text-anchor="middle" class="h" fill="#33691e">LOOP PCB</text>
  <text x="210" y="382" text-anchor="middle" class="note">LOOP IN · LOOP OUT</text>
  <text x="210" y="398" text-anchor="middle" class="note">RELOOP / EXIT</text>
  <text x="210" y="414" text-anchor="middle" class="note">HOT LOOP (MK2)</text>
  <text x="210" y="430" text-anchor="middle" class="dwg">may be combined with hot cue</text>

  <!-- Memory / call cluster -->
  <rect x="100" y="460" width="220" height="90" rx="8" class="keep"/>
  <text x="210" y="484" text-anchor="middle" class="h" fill="#33691e">MEMORY PCB</text>
  <text x="210" y="502" text-anchor="middle" class="note">MEMORY · CALL ◁ · CALL ▷</text>
  <text x="210" y="518" text-anchor="middle" class="note">DELETE · MP3 FOLDER ◁▷</text>

  <!-- Display board (front bezel) -->
  <rect x="180" y="700" width="600" height="120" rx="10" class="keep-led"/>
  <text x="480" y="724" text-anchor="middle" class="h" fill="#f57f17">DISPLAY BOARD (KEEP — LEDs ONLY)</text>
  <text x="480" y="740" text-anchor="middle" class="dwg">JFLB Assy = DWG1568</text>
  <text x="480" y="758" text-anchor="middle" class="note">VFD glass + µPD16306B driver (IC1201) ← DARK in v0.1</text>
  <rect x="220" y="765" width="200" height="40" class="glass"/>
  <text x="320" y="790" text-anchor="middle" class="note">VFD glass — not driven</text>
  <circle cx="480" cy="785" r="6" fill="#42a5f5" stroke="#01579b"/>
  <circle cx="510" cy="785" r="6" fill="#ff9800" stroke="#e65100"/>
  <circle cx="540" cy="785" r="6" fill="#ff9800" stroke="#e65100"/>
  <circle cx="570" cy="785" r="6" fill="#ff9800" stroke="#e65100"/>
  <circle cx="600" cy="785" r="6" fill="#ff9800" stroke="#e65100"/>
  <text x="480" y="810" text-anchor="middle" class="note">↑ plain LEDs we drive from S3 via MOSFETs (TIME/A.CUE/MEMORY/TEMPO-RANGE)</text>

  <!-- Discrete buttons in front -->
  <rect x="100" y="700" width="60" height="60" rx="8" class="keep"/>
  <text x="130" y="724" text-anchor="middle" class="note">PLAY/</text>
  <text x="130" y="738" text-anchor="middle" class="note">PAUSE</text>
  <text x="130" y="754" text-anchor="middle" class="dwg">discrete</text>

  <rect x="800" y="700" width="60" height="60" rx="8" class="keep"/>
  <text x="830" y="730" text-anchor="middle" class="note">CUE</text>
  <text x="830" y="754" text-anchor="middle" class="dwg">discrete</text>

  <rect x="800" y="120" width="120" height="60" rx="8" class="keep"/>
  <text x="860" y="146" text-anchor="middle" class="note">VINYL / CDJ</text>
  <text x="860" y="166" text-anchor="middle" class="note">EJECT</text>
  <text x="860" y="180" text-anchor="middle" class="dwg">discrete</text>

  <!-- ESP32-S3 placement zone (where main board was) -->
  <rect x="540" y="380" width="180" height="170" rx="10" class="esp"/>
  <text x="630" y="410" text-anchor="middle" class="h" fill="#0d47a1">ESP32-S3</text>
  <text x="630" y="426" text-anchor="middle" class="h" fill="#0d47a1">DevKitC-1</text>
  <text x="630" y="446" text-anchor="middle" class="note">mounts here</text>
  <text x="630" y="460" text-anchor="middle" class="note">(replaces DWX2305 MAIN)</text>
  <text x="630" y="488" text-anchor="middle" class="note">USB-C → host PC</text>
  <text x="630" y="506" text-anchor="middle" class="note">+ small carrier PCB</text>
  <text x="630" y="520" text-anchor="middle" class="note">w/ 2× 4067 mux,</text>
  <text x="630" y="534" text-anchor="middle" class="note">TXS0108E, MOSFETs</text>

  <!-- Removed: main PCB -->
  <rect x="540" y="80" width="180" height="34" rx="6" class="remove"/>
  <text x="630" y="102" text-anchor="middle" class="h" fill="#b71c1c">✖ DWX2305 MAIN — REMOVED</text>

  <!-- Removed: CD drive -->
  <rect x="100" y="570" width="220" height="110" rx="8" class="remove"/>
  <text x="210" y="600" text-anchor="middle" class="h" fill="#b71c1c">✖ CD DRIVE — REMOVED</text>
  <text x="210" y="618" text-anchor="middle" class="note">slot-in mechanism</text>
  <text x="210" y="634" text-anchor="middle" class="note">+ servo board</text>
  <text x="210" y="654" text-anchor="middle" class="note">(slot bezel kept,</text>
  <text x="210" y="668" text-anchor="middle" class="note">covered or repurposed)</text>

  <!-- Removed: PSU board -->
  <rect x="800" y="570" width="120" height="110" rx="8" class="remove"/>
  <text x="860" y="600" text-anchor="middle" class="h" fill="#b71c1c">✖ PSU</text>
  <text x="860" y="618" text-anchor="middle" class="note">AC mains →</text>
  <text x="860" y="634" text-anchor="middle" class="note">±V rails</text>
  <text x="860" y="652" text-anchor="middle" class="note">v0.1: removed</text>
  <text x="860" y="668" text-anchor="middle" class="note">(USB-bus only)</text>

  <!-- Legend -->
  <rect x="990" y="80" width="200" height="370" rx="10" fill="#fff" stroke="#888"/>
  <text x="1090" y="106" text-anchor="middle" class="h">LEGEND</text>

  <rect x="1010" y="124" width="22" height="22" class="keep"/>
  <text x="1042" y="140" class="note">KEEP — re-wired</text>
  <text x="1042" y="153" class="note">to ESP32-S3</text>

  <rect x="1010" y="170" width="22" height="22" class="keep-led"/>
  <text x="1042" y="186" class="note">KEEP — LED-only</text>
  <text x="1042" y="199" class="note">reuse (VFD dark)</text>

  <rect x="1010" y="216" width="22" height="22" class="esp"/>
  <text x="1042" y="232" class="note">ESP32-S3</text>
  <text x="1042" y="245" class="note">+ carrier PCB</text>

  <rect x="1010" y="262" width="22" height="22" class="remove"/>
  <text x="1042" y="278" class="note">REMOVE / gut</text>

  <line x1="1010" y1="306" x2="1180" y2="306" stroke="#c62828" stroke-width="2"/>
  <text x="1095" y="320" text-anchor="middle" class="note" fill="#c62828">5 V supply</text>

  <line x1="1010" y1="334" x2="1180" y2="334" stroke="#1565c0" stroke-width="2"/>
  <text x="1095" y="348" text-anchor="middle" class="note" fill="#1565c0">3.3 V supply</text>

  <line x1="1010" y1="362" x2="1180" y2="362" stroke="#fbc02d" stroke-width="3"/>
  <text x="1095" y="376" text-anchor="middle" class="note" fill="#f57f17">12 V LED rail</text>

  <line x1="1010" y1="390" x2="1180" y2="390" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1095" y="404" text-anchor="middle" class="note">GND</text>

  <line x1="1010" y1="418" x2="1180" y2="418" stroke="#0d47a1" stroke-width="2"/>
  <text x="1095" y="432" text-anchor="middle" class="note" fill="#0d47a1">signal</text>

  <!-- Stats / notes panel -->
  <rect x="990" y="470" width="200" height="370" rx="10" fill="#fff" stroke="#888"/>
  <text x="1090" y="496" text-anchor="middle" class="h">v0.1 SCOPE</text>
  <text x="1010" y="520" class="note">• S3-only (no STM32 Disco)</text>
  <text x="1010" y="538" class="note">• USB-bus powered</text>
  <text x="1010" y="556" class="note">• MT3608 boost → 12 V</text>
  <text x="1010" y="574" class="note">  (OEM CUE/PLAY/LOOP LEDs)</text>
  <text x="1010" y="596" class="note">• VFD glass dark</text>
  <text x="1010" y="614" class="note">• Plain JFLB LEDs driven</text>
  <text x="1010" y="632" class="note">  via small N-MOSFETs</text>
  <text x="1010" y="654" class="note">• Jog-centre cursor:</text>
  <text x="1010" y="672" class="note">  capture protocol byte</text>
  <text x="1010" y="690" class="note">  pre-disassembly</text>
  <text x="1010" y="708" class="note">  (for v0.2 wiring)</text>
  <text x="1010" y="730" class="note">• 2× 74HC4067 muxes for</text>
  <text x="1010" y="748" class="note">  ~20 button matrix</text>
  <text x="1010" y="766" class="note">• TXS0108E level shifter</text>
  <text x="1010" y="784" class="note">  for jog quadrature</text>
  <text x="1010" y="806" class="note">• Pitch fader 3.3 V re-feed</text>
  <text x="1010" y="824" class="note">  (NOT OEM 5 V)</text>

  <!-- FRONT label -->
  <text x="510" y="888" text-anchor="middle" class="h">⟵ FRONT PANEL (CD slot bezel, ¼" headphone jack) ⟶</text>
</svg>
